name: Check keys (posts nothing)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/check_keys.py", "checks/last"]
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests google-api-python-client google-auth
      - shell: bash
        env:
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IG_USER_ID_HI: ${{ secrets.IG_USER_ID_HI }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
        run: python tools/check_keys.py 2>&1 | tee checks/keys_result.txt; exit ${PIPESTATUS[0]}
      - name: Save the result in the repo (so Claude can read it)
        if: always()
        run: |
          git config user.name kathaclay-bot && git config user.email kathaclay-bot@users.noreply.github.com
          git add checks/keys_result.txt && git commit -q -m "key check result" && git pull -q --rebase origin main && git push -q || true
