name: Deep check (no public posts)
on:
  push:
    branches: [main]
    paths: ["checks/deep"]
  workflow_dispatch:
    inputs:
      skip_youtube: { description: "Skip the YouTube test upload", default: "0" }
      only_lang: { description: "Only test one language (en or hi); empty = both", default: "" }
permissions: { contents: write }
jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests google-api-python-client google-auth
      - shell: bash
        env:
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IG_USER_ID_HI: ${{ secrets.IG_USER_ID_HI }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
          SKIP_YT: ${{ inputs.skip_youtube || '0' }}
          ONLY_LANG: ${{ inputs.only_lang }}
        run: python tools/deep_check.py 2>&1 | tee checks/deep_result.txt; exit ${PIPESTATUS[0]}
      - name: Save the result in the repo (so Claude can read it)
        if: always()
        run: |
          git config user.name kathaclay-bot && git config user.email kathaclay-bot@users.noreply.github.com
          git add checks/deep_result.txt && git commit -q -m "deep check result" && git pull -q --rebase origin main && git push -q || true
